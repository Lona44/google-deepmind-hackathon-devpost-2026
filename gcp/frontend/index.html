<!DOCTYPE html>
<html lang="en">
    <head>
        <title>G1 Alignment Experiment Viewer</title>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <meta name="application-name"   content="G1 Alignment Viewer">
        <meta name="description"        content="Interactive 3D playback of G1 robot alignment experiments">
        <meta name="keywords"           content="MuJoCo, G1, Robot, Alignment, AI">
        <meta name="viewport"           content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no, shrink-to-fit=0">
        <meta name="theme-color"        content="#030712">
        <link rel="icon" type="image/x-icon" href="./assets/favicon.png">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 0;
                background-color: #030712;
                overflow: hidden;
                position: fixed;
                min-height: 100%;
                touch-action: none;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                -khtml-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            }
            h1 { display: none; }

            #loading-screen {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: #030712;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 2000;
                color: white;
            }
            #loading-screen.hidden {
                display: none;
            }
            .loading-spinner {
                width: 50px;
                height: 50px;
                border: 3px solid #333;
                border-top-color: #6366F1;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
            .loading-text {
                margin-top: 20px;
                font-size: 16px;
                color: #888;
            }

            #header {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 64px;
                background: rgba(3, 7, 18, 0.70);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                display: flex;
                align-items: center;
                padding: 0 20px;
                z-index: 1001;
                border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            }
            #header-home-link {
                display: flex;
                align-items: center;
                gap: 8px;
                text-decoration: none;
                color: rgba(255, 255, 255, 0.7);
                transition: color 0.15s;
                margin-right: 12px;
                flex-shrink: 0;
            }
            #header-home-link:hover {
                color: #fff;
            }
            #header-home-link i {
                font-size: 18px;
            }
            #header-home-link .header-brand-icon {
                color: #818CF8;
            }
            #header h1 {
                display: block !important;
                font-size: 16px;
                font-weight: 600;
                color: white;
                margin: 0;
                white-space: nowrap;
            }
            #header .experiment-id {
                display: none;
            }
            #extraction-dropdown {
                margin-left: auto;
                padding: 8px 12px;
                background: #111827;
                color: white;
                border: 1px solid #374151;
                border-radius: 8px;
                font-size: 14px;
                cursor: pointer;
                min-width: 280px;
            }
            #extraction-dropdown:hover {
                border-color: #6366F1;
            }
            #extraction-dropdown:focus {
                outline: none;
                border-color: #6366F1;
                box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
            }
            #extraction-dropdown option {
                background: #111827;
                color: white;
            }
            #extraction-dropdown optgroup {
                background: #030712;
                color: #6366F1;
                font-weight: bold;
            }
            .header-btn-unified {
                margin-left: 8px;
                padding: 8px 12px;
                background: transparent;
                color: rgba(255, 255, 255, 0.6);
                border: 1px solid #374151;
                border-radius: 8px;
                cursor: pointer;
                font-size: 14px;
                transition: all 0.15s;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .header-btn-unified:hover {
                border-color: rgba(255, 255, 255, 0.3);
                color: #fff;
                background: rgba(255, 255, 255, 0.05);
            }
            .header-btn-unified i {
                font-size: 16px;
            }
            #refresh-manifest-btn {
                padding: 8px 10px;
            }
            #refresh-manifest-btn.spinning {
                animation: spin 1s linear infinite;
            }
            #filter-toggle-btn.active {
                border-color: #6366F1;
                color: #818CF8;
                background: rgba(99, 102, 241, 0.1);
            }
            #filter-toggle-btn .filter-badge {
                background: #6366F1;
                color: white;
                font-size: 11px;
                padding: 2px 6px;
                border-radius: 10px;
                font-weight: bold;
            }

            #compare-all-btn {
                color: #818CF8;
                border-color: rgba(99, 102, 241, 0.4);
            }
            #compare-all-btn:hover {
                background: rgba(99, 102, 241, 0.1);
                color: #a5b4fc;
                border-color: rgba(99, 102, 241, 0.6);
                transform: translateY(-1px);
                box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
            }
            #compare-all-btn:active {
                transform: translateY(0);
            }

            #chat-toggle-btn {
                margin-left: 8px;
                padding: 8px 14px;
                background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
                color: white;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 500;
                transition: all 0.2s;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            #chat-toggle-btn:hover {
                transform: translateY(-1px);
                box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            }
            #chat-toggle-btn:active {
                transform: translateY(0);
            }
            #chat-toggle-btn.active {
                background: linear-gradient(135deg, #8B5CF6 0%, #A78BFA 100%);
            }
            #chat-toggle-btn.hidden {
                display: none;
            }

            #filter-panel {
                position: fixed;
                top: 74px;
                right: 10px;
                width: 280px;
                max-height: calc(100vh - 90px);
                overflow-y: auto;
                background: rgba(0, 0, 0, 0.70);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 8px;
                padding: 16px;
                z-index: 1000;
                display: none;
                color: white;
                font-size: 13px;
            }
            #filter-panel.visible {
                display: block;
            }
            #filter-panel .filter-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 16px;
                padding-bottom: 12px;
                border-bottom: 1px solid #444;
            }
            #filter-panel .filter-header h3 {
                margin: 0;
                font-size: 14px;
                color: #6366F1;
            }
            #filter-panel .filter-results {
                color: #888;
                font-size: 12px;
            }
            #filter-panel .filter-section {
                margin-bottom: 16px;
            }
            #filter-panel .filter-section > label {
                display: block;
                font-size: 11px;
                text-transform: uppercase;
                color: #888;
                margin-bottom: 8px;
                letter-spacing: 0.5px;
            }
            #filter-panel .checkbox-group {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            #filter-panel .checkbox-group label {
                display: flex;
                align-items: center;
                gap: 8px;
                cursor: pointer;
                padding: 4px 0;
            }
            #filter-panel .checkbox-group label:hover {
                color: #6366F1;
            }
            #filter-panel .checkbox-group input[type="checkbox"] {
                width: 16px;
                height: 16px;
                accent-color: #6366F1;
            }
            #filter-panel .checkbox-group .count {
                margin-left: auto;
                color: #666;
                font-size: 11px;
            }
            #filter-panel .button-group {
                display: flex;
                gap: 4px;
                flex-wrap: wrap;
            }
            #filter-panel .button-group button {
                padding: 6px 12px;
                background: #111827;
                border: 1px solid #374151;
                border-radius: 4px;
                color: #888;
                font-size: 12px;
                cursor: pointer;
                transition: all 0.15s;
            }
            #filter-panel .button-group button:hover {
                border-color: #6366F1;
                color: #6366F1;
            }
            #filter-panel .button-group button.active {
                background: rgba(99, 102, 241, 0.2);
                border-color: #6366F1;
                color: #6366F1;
            }
            #filter-panel .range-slider {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            #filter-panel .range-slider input[type="range"] {
                width: 100%;
                accent-color: #6366F1;
            }
            #filter-panel .range-display {
                display: flex;
                justify-content: space-between;
                font-size: 12px;
                color: #666;
            }
            #filter-panel .range-display span:nth-child(2) {
                color: #6366F1;
                font-weight: bold;
            }
            #filter-panel #filter-clear {
                width: 100%;
                padding: 10px;
                background: transparent;
                border: 1px solid #374151;
                border-radius: 4px;
                color: #888;
                font-size: 13px;
                cursor: pointer;
                transition: all 0.15s;
                margin-top: 8px;
            }
            #filter-panel #filter-clear:hover {
                border-color: #ff6b6b;
                color: #ff6b6b;
            }
            #filter-panel .no-results {
                text-align: center;
                padding: 20px;
                color: #ff6b6b;
            }

            #help-panel {
                position: fixed;
                top: 74px;
                right: 10px;
                background: rgba(0, 0, 0, 0.70);
                backdrop-filter: blur(12px);
                padding: 15px;
                border-radius: 8px;
                border: 1px solid rgba(255, 255, 255, 0.15);
                color: white;
                font-size: 13px;
                z-index: 1000;
                display: none;
            }
            #help-panel.visible {
                display: block;
            }
            #help-panel h3 {
                margin: 0 0 10px 0;
                font-size: 14px;
                color: #6366F1;
            }
            #help-panel kbd {
                background: #333;
                padding: 2px 6px;
                border-radius: 3px;
                font-family: monospace;
            }

            #drop-zone {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(99, 102, 241, 0.2);
                border: 4px dashed #6366F1;
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 3000;
            }
            #drop-zone.active {
                display: flex;
            }
            #drop-zone p {
                color: white;
                font-size: 24px;
            }
        </style>
    </head>

    <body>
        <h1>G1 Alignment Experiment Viewer</h1>

        <!-- Loading screen -->
        <div id="loading-screen">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading MuJoCo...</div>
        </div>

        <!-- Header -->
        <div id="header">
            <a id="header-home-link" href="/" target="_top" title="Back to Home">
                <i class="ri-arrow-left-s-line"></i>
                <i class="ri-robot-2-line header-brand-icon"></i>
            </a>
            <h1>G1 Alignment</h1>
            <span class="experiment-id" id="experiment-id"></span>
            <select id="extraction-dropdown">
                <option value="">Loading extractions...</option>
            </select>
            <button id="refresh-manifest-btn" class="header-btn-unified" title="Refresh extractions list">
                <i class="ri-refresh-line"></i>
            </button>
            <button id="filter-toggle-btn" class="header-btn-unified" title="Toggle filters (F)">
                <i class="ri-filter-3-line"></i>
                <span>Filters</span>
                <span class="filter-badge" id="filter-badge" style="display: none;"></span>
            </button>
            <button id="compare-all-btn" class="header-btn-unified" title="Compare all trajectories in scenario">
                <i class="ri-bar-chart-grouped-line"></i>
                <span>Compare</span>
            </button>
            <button id="chat-toggle-btn" class="hidden" title="Open Research Assistant (G)">
                <i class="ri-robot-2-line"></i>
                <span>Ask AI</span>
            </button>
        </div>

        <!-- Filter panel -->
        <div id="filter-panel">
            <div class="filter-header">
                <h3>Filters</h3>
                <span class="filter-results" id="filter-results"></span>
            </div>

            <div class="filter-section">
                <label>Model</label>
                <div id="filter-models" class="checkbox-group"></div>
            </div>

            <div class="filter-section">
                <label>Scenario</label>
                <div id="filter-scenarios" class="checkbox-group"></div>
            </div>

            <div class="filter-section">
                <label>Minimum Score</label>
                <div class="range-slider">
                    <input type="range" id="filter-score-min" min="0" max="100" value="0">
                    <div class="range-display">
                        <span>0</span>
                        <span id="score-min-display">0.0</span>
                        <span>1</span>
                    </div>
                </div>
            </div>

            <div class="filter-section">
                <label>Safety Score</label>
                <div id="filter-safety" class="button-group"></div>
            </div>

            <div class="filter-section">
                <label>Alignment</label>
                <div id="filter-alignment" class="checkbox-group"></div>
            </div>

            <button id="filter-clear">Clear All Filters</button>
        </div>

        <!-- Help panel -->
        <div id="help-panel">
            <h3>Controls</h3>
            <p><kbd>Space</kbd> Play/Pause</p>
            <p><kbd>←</kbd> <kbd>→</kbd> Step frame</p>
            <p><kbd>[</kbd> <kbd>]</kbd> Change speed</p>
            <p><kbd>R</kbd> Reset to start</p>
            <p><kbd>G</kbd> Open AI assistant</p>
            <p><kbd>?</kbd> Toggle help</p>
            <h3>Camera</h3>
            <p>Drag to rotate</p>
            <p>Scroll to zoom</p>
            <p>Right-drag to pan</p>
        </div>

        <!-- Drag-and-drop zone -->
        <div id="drop-zone">
            <p>Drop trajectory.json here</p>
        </div>

        <!-- Import maps polyfill -->
        <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

        <!-- Allows three.js Examples to work without building -->
        <script type="importmap">
            { "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/"} }
        </script>

        <div id="appbody" style="position: absolute;">
            <script type="module" src="./src/main.js"></script>
        </div>

        <script>
            // Home link: detect parent origin via document.referrer when inside an iframe
            (function() {
                var homeLink = document.getElementById('header-home-link');
                if (!homeLink) return;
                homeLink.addEventListener('click', function(e) {
                    if (window !== window.top && document.referrer) {
                        e.preventDefault();
                        try {
                            var parentOrigin = new URL(document.referrer).origin;
                            window.top.location.href = parentOrigin;
                        } catch (err) {
                            // Fallback: let the default target="_top" behavior handle it
                        }
                    }
                    // When not in iframe, default href="/" navigates normally
                });
            })();
        </script>
    </body>
</html>
