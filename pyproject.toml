[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-alignment-experiment"
version = "0.1.0"
description = "AI alignment research using simulated Unitree G1 robot with Gemini reasoning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Your Name", email = "your@email.com"}
]
keywords = ["ai", "alignment", "robotics", "mujoco", "gemini", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mujoco>=3.0.0",
    "google-genai>=1.0.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0.0",  # Timeout for integration tests
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",  # Type stubs for PyYAML
    # Inspect AI integration
    "inspect-ai>=0.3.0",    # UK AISI evaluation framework
    # Model provider SDKs (Inspect loads these per subject/judge; openai is also
    # imported at module load by inspect_eval/kimi_provider.py)
    "openai>=1.0.0",        # OpenAI + OpenAI-compatible (Kimi) provider
    "anthropic>=0.40.0",    # Anthropic (Claude/Opus) subject + default judge provider
    "json-repair>=0.30.0",  # repair malformed judge JSON (unescaped quotes, truncation)
    # Refactoring safety tools
    "tach>=0.10.0",        # Dependency graph analysis
    "pyan3>=1.2.0",        # Call graph visualization
    "mutmut>=2.4.0",       # Mutation testing
    # judge_panel dependencies
    "pydantic>=2.5.0",         # judge_panel typed contracts (transitive via inspect-ai but pin explicitly)
    "httpx>=0.25.0",           # OpenRouter client (transitive via inspect-ai but pin explicitly)
    "pytest-asyncio>=0.21.0",  # async test support for orchestrator + roles
]
# ROS2 dependencies are installed via apt/rosdep in the Docker container
# This group is for documentation purposes - these packages come from ROS2
ros2 = [
    # Installed via: apt install ros-humble-rclpy ros-humble-sensor-msgs ...
    # "rclpy",  # ROS2 Python client library
    # "sensor_msgs",  # LaserScan, Imu messages
    # "nav_msgs",  # Odometry messages
    # "geometry_msgs",  # Twist, TransformStamped
    # "tf2_ros",  # Transform broadcasting
    # "rosgraph_msgs",  # Clock message
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/g1-alignment-experiment"
Repository = "https://github.com/YOUR_USERNAME/g1-alignment-experiment"
Documentation = "https://github.com/YOUR_USERNAME/g1-alignment-experiment#readme"

[project.scripts]
g1-experiment = "src.main:main"
g1-ros2 = "src.ros2_main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# =============================================================================
# Ruff Configuration
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "unitree_rl_gym",  # External dependency
    "archive",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "PLR0911", # Too many return statements
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value comparison
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ARG", "PLR", "PLC0415",  # Allow flexible imports/args in tests
    "E402",      # sys.path setup before imports
    "PLW1510",   # subprocess.run without check= is fine for CLI smoke tests
    "ERA001",    # commented scaffolding in test fixtures
    "RUF002", "RUF003",  # ambiguous unicode in test docstrings/comments
]
"modal/*" = ["PLC0415", "B008"]  # Modal functions need imports inside; FastAPI Depends pattern
"local_runner.py" = ["PLC0415"]  # Lazy imports for heavy dependencies
"src/simulation.py" = ["PLR0915"]  # Complex simulation logic
"inspect_eval/kimi_provider.py" = ["PLW0603"]  # Global state for rate limit circuit breaker

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services (MuJoCo + API keys)",
    "mujoco: marks tests requiring MuJoCo installation",
]

# =============================================================================
# Coverage Configuration
# =============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# =============================================================================
# MyPy Configuration
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "unitree_rl_gym",
    "archive",
    "venv",
]

# =============================================================================
# Tach Configuration (Dependency Analysis)
# =============================================================================
[tool.tach]
source_roots = ["src"]
exact = true
exclude = [
    "tests",
    "unitree_rl_gym",
    "venv",
]

# =============================================================================
# Mutmut Configuration (Mutation Testing)
# =============================================================================
[tool.mutmut]
paths_to_mutate = "src/"
tests_dir = "tests/"
runner = "pytest -x -q"
