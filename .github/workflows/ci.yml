name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration tests (uses API quota)'
        required: false
        default: false
        type: boolean

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check src/ tests/

      - name: Run Ruff formatter (check)
        run: ruff format --check src/ tests/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short -m "not integration and not mujoco"

      - name: Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing -m "not integration and not mujoco"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mypy types-PyYAML

      - name: Run MyPy (full project)
        run: mypy src/ --ignore-missing-imports

  refactor-safety:
    name: Refactor Safety
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install tach pyan3

      - name: Check for circular imports
        run: |
          tach mod src/ || echo "Initializing tach..."
          tach check || echo "No circular dependency violations"

      - name: Generate dependency graph
        run: |
          pyan3 src/*.py --dot -c > deps.dot 2>/dev/null || true
          echo "Dependency graph generated (deps.dot)"

      - name: Upload dependency graph
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: deps.dot
          if-no-files-found: ignore

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install bandit detect-secrets

      - name: Run Bandit security scan
        run: bandit -r src/ -ll -ii
        continue-on-error: true  # Report issues but don't fail

      - name: Scan for secrets
        run: |
          # Scan the codebase for secrets (exclude lockfiles, node_modules, and UI false positives)
          detect-secrets scan --baseline .secrets.baseline \
            --exclude-files 'pnpm-lock\.yaml$' \
            --exclude-files 'package-lock\.json$' \
            --exclude-files 'node_modules/' \
            --exclude-files '\.tsx$'
          # Extract only the results (actual secrets) - ignore metadata changes
          BASELINE_RESULTS=$(jq -r '.results | keys | length' .secrets.baseline)
          if [ "$BASELINE_RESULTS" -eq 0 ]; then
            echo "No secrets detected - OK"
          else
            echo "ERROR: Secrets detected in codebase!"
            jq '.results' .secrets.baseline
            exit 1
          fi

      - name: Check for .env files in repo
        run: |
          # Fail if any .env files are tracked (except .env.example)
          if git ls-files | grep -E '^\.env$|^\.env\.' | grep -v '\.example$'; then
            echo "ERROR: .env files should not be committed!"
            exit 1
          fi
          echo "No .env files found in repo - OK"

  # Integration tests - only run on manual trigger with run_integration=true
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration == true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Running integration tests with real API calls..."
          echo "This will use Gemini API quota."
          pytest tests/integration/ -v -m integration --timeout=600

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            experiments/
          if-no-files-found: ignore
